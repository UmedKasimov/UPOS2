plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.upos.integrator'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.upos.integrator'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.0.13'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
