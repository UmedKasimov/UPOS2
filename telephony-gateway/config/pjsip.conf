[global]
type=global
user_agent=UPOS SIP gateway

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=${PUBLIC_IP}
external_media_address=${PUBLIC_IP}
local_net=127.0.0.1/8

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[210]
type=endpoint
transport=transport-wss
context=from-browser
disallow=all
allow=alaw,ulaw
auth=browser-auth
aors=210
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[210]
type=aor
max_contacts=4
remove_existing=yes
qualify_frequency=30

[browser-auth]
type=auth
auth_type=userpass
username=210
password=${BROWSER_PASSWORD}

[provider]
type=endpoint
transport=transport-udp
context=from-provider
disallow=all
allow=alaw,ulaw
aors=provider
outbound_auth=provider-auth
from_user=${REMOTE_USER}
from_domain=${REMOTE_HOST}
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[provider]
type=aor
contact=sip:${REMOTE_HOST}:${REMOTE_PORT}

[provider-auth]
type=auth
auth_type=userpass
username=${REMOTE_AUTH}
password=${REMOTE_PASSWORD}

[provider-identify]
type=identify
endpoint=provider
match=${REMOTE_HOST}

${REGISTRATION}
