[general]
static=yes
writeprotect=yes

[from-provider]
exten => _.,1,NoOp(UPOS incoming call)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(210)},45)
 same => n,Hangup()

[from-browser]
exten => _X.,1,Dial(PJSIP/${EXTEN}@provider,60)
 same => n,Hangup()
exten => _+X.,1,Dial(PJSIP/${EXTEN}@provider,60)
 same => n,Hangup()
