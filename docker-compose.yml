services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-upos}
      POSTGRES_USER: ${POSTGRES_USER:-upos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - upos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upos} -d ${POSTGRES_DB:-upos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - upos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - upos_telephony_uploads:/app/upos/static/uploads/telephony
    environment:
      REDIS_URL: redis://redis:6379/0
      UPOS_RUN_SCHEDULERS: "0"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build: .
    restart: unless-stopped
    command: python -m upos.worker
    env_file: .env
    volumes:
      - upos_telephony_uploads:/app/upos/static/uploads/telephony
    environment:
      REDIS_URL: redis://redis:6379/0
      UPOS_RUN_SCHEDULERS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  upos_postgres_data:
  upos_redis_data:
  upos_telephony_uploads:
