<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящий звонок U-POS</title>
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <header class="topbar"><strong>U-POS</strong><span id="line">Телефон</span><button id="open-phone" type="button">Телефон ↗</button></header>
  <main class="card" data-phase="incoming">
    <div class="avatar" aria-hidden="true">☎</div>
    <p id="eyebrow" class="eyebrow">Входящий звонок</p>
    <h1><button id="caller" class="identity" type="button">Определяем номер…</button></h1>
    <button id="phone" class="phone identity" type="button" hidden></button>
    <p id="timer" class="timer" hidden>00:00</p>
    <p id="error" class="error" role="status" hidden></p>

    <div id="incoming-actions" class="primary-actions" hidden>
      <button id="reject" type="button" class="danger"><span>✕</span>Отклонить</button>
      <button id="answer" type="button" class="accept"><span>☎</span>Принять</button>
    </div>
    <div id="active-actions" class="active-actions" hidden>
      <button id="mute" type="button" aria-pressed="false">Микрофон выкл.</button>
      <button id="hold" type="button" aria-pressed="false">Удержать</button>
      <button id="show-keypad" type="button">Клавиатура</button>
      <button id="show-transfer" type="button">Перевести</button>
      <button id="hangup" type="button" class="danger">Завершить разговор</button>
    </div>
    <div id="ended-actions" class="primary-actions" hidden>
      <button id="redial" type="button" class="accept">Перезвонить</button>
      <button id="close" type="button">Закрыть</button>
    </div>

    <div id="contact-actions" class="contact-actions" hidden>
      <button id="show-contact" type="button" hidden>+ Сохранить контакт</button>
    </div>
    <form id="contact-form" class="subpanel" hidden>
      <strong>Новый контакт</strong>
      <label>Имя клиента<input id="contact-name" type="text" maxlength="255" required autocomplete="name"></label>
      <label>Номер<input id="contact-phone" type="tel" required></label>
      <div class="subpanel-actions"><button type="submit" class="accept">Сохранить</button><button id="cancel-contact" type="button">Отмена</button></div>
    </form>
    <form id="transfer-form" class="subpanel" hidden>
      <strong>Перевести вызов</strong>
      <label>Внутренняя линия или обычный номер<input id="transfer-phone" type="tel" placeholder="210 или +998…" required></label>
      <div id="transfer-presets" class="presets"></div>
      <div class="subpanel-actions"><button type="submit" class="accept">Перевести</button><button id="cancel-transfer" type="button">Отмена</button></div>
    </form>
    <div id="keypad" class="keypad" hidden aria-label="Клавиатура DTMF">
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key="*">*</button><button type="button" data-key="0">0</button><button type="button" data-key="#">#</button>
    </div>
    <button id="incoming-transfer" type="button" class="secondary-action" hidden>Переадресовать входящий</button>
  </main>
  <script src="call.js"></script>
</body>
</html>
